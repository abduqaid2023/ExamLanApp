name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build APK
      run: |
        # البحث التلقائي عن مكان وجود ملف gradlew في المستودع والدخول إليه
        GRADLEW_PATH=$(find . -name "gradlew" -type f -exec dirname {} \;)
        echo "Found gradlew in: $GRADLEW_PATH"
        cd "$GRADLEW_PATH"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
