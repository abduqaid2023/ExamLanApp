name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        unzip ExamLanApp.zip -d extracted_project
        cd extracted_project/ExamLanApp
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd extracted_project/ExamLanApp
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: extracted_project/ExamLanApp/app/build/outputs/apk/debug/app-debug.apk
